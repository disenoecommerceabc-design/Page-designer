<div class="section-heading">{{ text('p', content.eyebrow, 'eyebrow', 'eyebrow') }}{{ text('h2', content.title, 'title') }}{{ text('p', content.description, 'description', 'section-description') }}</div><div class="quote-grid">{% for item in content.items %}<figure><span class="quote-mark">“</span>{{ text('blockquote', item.description, 'items.' ~ loop.index0 ~ '.description') }}<figcaption>{{ text('strong', item.title, 'items.' ~ loop.index0 ~ '.title') }}<span>{{ item.badge }}</span></figcaption></figure>{% endfor %}</div>
