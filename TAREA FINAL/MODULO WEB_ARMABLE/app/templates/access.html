<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu cuenta · Page Builder</title>
  <link rel="stylesheet" href="/static/editor.css?v=1.3.5">
  <script src="/static/access.js?v=1.3.5" defer></script>
  <style>
    [hidden]{display:none!important}
    .access-card{width:min(440px,calc(100% - 32px));margin:8vh auto;padding:28px;background:white;border:1px solid #dde3da;border-radius:12px}
    .access-card h1{margin:18px 0 8px;font-size:26px}
    .access-card form{margin-top:24px}
    .access-card .button{margin-top:8px}
  </style>
</head>
<body>
  <main class="access-card">
    <a href="/">← Volver a Page Builder</a>
    <h1 id="access-title">Acceso a Page Builder</h1>
    <p>Inicia sesión y elige un plan para abrir el editor.</p>
    <p id="access-status" class="inline-error" role="status"></p>
    <form id="login" hidden>
      <div class="field"><label for="login-user">Correo o usuario</label><input id="login-user" name="username" required maxlength="254" autocomplete="username"></div>
      <div class="field"><label for="login-password">Contraseña</label><input id="login-password" type="password" name="password" required maxlength="200" autocomplete="current-password"></div>
      <button class="button primary" type="submit">Iniciar sesión</button>
      <button class="button" type="button" id="show-register">Crear cuenta</button>
    </form>
    <form id="register" hidden>
      <div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" name="email" required maxlength="254" autocomplete="username"></div>
      <div class="field"><label for="new-password">Contraseña</label><input id="new-password" type="password" name="password" required minlength="12" maxlength="200" autocomplete="new-password"><small>Al menos 12 caracteres.</small></div>
      <div class="field" id="invitation-field" hidden><label for="invitation">Código de invitación</label><input id="invitation" name="invitation" maxlength="200"></div>
      <div class="field"><label for="register-plan">Plan</label><select id="register-plan" name="plan" required></select></div>
      <p>Elegir un plan no genera un cobro.</p>
      <button class="button primary" type="submit">Crear mi cuenta</button>
      <button class="button" type="button" id="show-login">Ya tengo una cuenta</button>
    </form>
    <form id="select-plan" hidden>
      <div class="field"><label for="account-plan">Plan</label><select id="account-plan" name="plan" required></select></div>
      <p>Elegir un plan no genera un cobro.</p>
      <button class="button primary" type="submit">Confirmar plan</button>
      <button class="button" type="button" id="sign-out">Cerrar sesión</button>
    </form>
  </main>
</body>
</html>
