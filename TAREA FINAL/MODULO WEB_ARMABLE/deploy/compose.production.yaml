name: modulo-production
services:
  app:
    image: ${MODULO_IMAGE:-modulo-editor:1.1.0}
    environment:
      APP_ENV: production
      DATA_DIR: /data
      PORT: 8000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET}
      COOKIE_SECURE: "true"
      ALLOWED_HOSTS: ${DOMAIN:?Define DOMAIN}
      # Solo Caddy alcanza este puerto privado y aporta las cabeceras de proxy.
      FORWARDED_ALLOW_IPS: "*"
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
      KIE_API_KEY: ${KIE_API_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_DAILY_CREDITS: ${AI_DAILY_CREDITS:-30}
      AI_GLOBAL_DAILY_CREDITS: ${AI_GLOBAL_DAILY_CREDITS:-60}
      AI_DAILY_REQUESTS: ${AI_DAILY_REQUESTS:-15}
    volumes:
      - modulo-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
  proxy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  modulo-data:
  caddy-data:
  caddy-config:
