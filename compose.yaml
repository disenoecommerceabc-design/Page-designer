name: page-builder
services:
  builder:
    build: .
    image: page-builder:1.3.5
    ports:
      - "127.0.0.1:8088:8000"
    environment:
      PORT: "8000"
      DATA_DIR: /data
      APP_ENV: local
      ALLOWED_HOSTS: localhost,127.0.0.1
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      KIE_API_KEY: ${KIE_API_KEY:-}
      KIE_TEXT_MODEL: ${KIE_TEXT_MODEL:-gpt-6-luna}
      KIE_IMAGE_DIRECTOR_MODEL: ${KIE_IMAGE_DIRECTOR_MODEL:-gpt-6-luna}
    volumes:
      - builder-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  builder-data:
